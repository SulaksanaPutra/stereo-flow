<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StereoFlow - Audio Balance Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon" aria-hidden="true">
          <div class="wave wave-left"></div>
          <div class="wave wave-center"></div>
          <div class="wave wave-right"></div>
        </div>
        <h1>StereoFlow</h1>
        <span class="version-tag">v1.1.0</span>
      </div>
      
      <div class="header-actions">
        <!-- Theme Switcher -->
        <div class="theme-toggle-group" id="theme-toggle-group" role="radiogroup" aria-label="Appearance theme selection">
          <button class="btn-theme-option active" data-theme-val="auto" title="System Auto Theme" aria-label="System Theme">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path></svg>
          </button>
          <button class="btn-theme-option" data-theme-val="light" title="Light Theme" aria-label="Light Theme">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
          <button class="btn-theme-option" data-theme-val="dark" title="Dark Theme" aria-label="Dark Theme">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>

        <!-- Settings Button -->
        <button class="btn-icon-action" id="btn-open-settings" title="Extension Settings" aria-label="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Section 1: Active Tab Controller -->
      <section class="section-card active-tab-section">
        <h2 class="section-title">Current Tab</h2>
        <div id="active-tab-container">
          <div class="loading-spinner">Loading tab audio status...</div>
        </div>
      </section>

      <!-- Section 2: Other Controlled Tabs -->
      <section class="section-card other-tabs-section" id="other-tabs-section" style="display: none;">
        <h2 class="section-title">Other Controlled Tabs</h2>
        <div id="other-tabs-list" class="other-tabs-list">
          <!-- Dynamically populated list of other captured tabs -->
        </div>
      </section>
    </main>

    <!-- Settings Overlay Modal -->
    <div class="settings-modal" id="settings-modal" aria-hidden="true">
      <div class="settings-content">
        <div class="settings-header">
          <div class="settings-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <h3>Extension Settings</h3>
          </div>
          <button class="btn-icon" id="btn-close-settings" title="Close Settings" aria-label="Close Settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="settings-body">
          <!-- Setting 1: Max Amplification Limit -->
          <div class="setting-item">
            <div class="setting-info">
              <label for="setting-max-vol">Max Amplification Limit</label>
              <p>Set upper volume limit on sliders</p>
            </div>
            <select id="setting-max-vol" class="setting-select">
              <option value="2.0">200% (Default)</option>
              <option value="3.0">300% (Boost Mode)</option>
            </select>
          </div>

          <!-- Setting 2: Limiter Protection Mode -->
          <div class="setting-item">
            <div class="setting-info">
              <label for="setting-limiter-mode">Clipping Protection</label>
              <p>Dynamic peak audio compressor ceiling</p>
            </div>
            <select id="setting-limiter-mode" class="setting-select">
              <option value="balanced">Balanced (-1 dB)</option>
              <option value="aggressive">Aggressive Peak (-3 dB)</option>
            </select>
          </div>

          <!-- Setting 3: Domain Memory -->
          <div class="setting-item">
            <div class="setting-info">
              <label for="setting-domain-memory">Remember Per-Site Settings</label>
              <p>Auto-restore tab settings on same domain</p>
            </div>
            <label class="setting-switch">
              <input type="checkbox" id="setting-domain-memory">
              <span class="switch-slider"></span>
            </label>
          </div>

          <!-- Setting 4: Reset All Tabs Action -->
          <div class="setting-action-block">
            <button class="btn-secondary btn-danger" id="btn-reset-all-tabs">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
              </svg>
              Reset All Controlled Tabs
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Independent per-tab audio balance & volume boost.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
